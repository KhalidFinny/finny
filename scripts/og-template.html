<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>finny — og card</title>
<style>
  /* Card shell rendered headlessly to a per-page PNG (see generate-og.mjs),
     which substitutes the eyebrow, title, and watermark slots. Real site fonts
     so the card carries the same voice as the site. */
  @font-face {
    font-family: "Schibsted Grotesk";
    src: url("../public/fonts/schibstedgrotesk-variable.woff2") format("woff2-variations");
    font-weight: 400 700;
    font-style: normal;
  }
  @font-face {
    font-family: "Instrument Serif";
    src: url("../public/fonts/instrumentserif-regular.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
  }

  :root {
    --wall: #f7f2ed;
    --paper: #fffdfc;
    --ink: #18120f;
    --graphite: #736661;
    --line: #e7d5d1;
    --brand: #970b2d;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { width: 1200px; height: 630px; overflow: hidden; }

  body {
    font-family: "Schibsted Grotesk", sans-serif;
    color: var(--ink);
    background-color: var(--wall);
    background-image:
      linear-gradient(to right, rgba(231, 213, 209, 0.75) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(231, 213, 209, 0.75) 1px, transparent 1px);
    background-size: 40px 40px;
    -webkit-font-smoothing: antialiased;
  }

  .frame {
    position: absolute;
    inset: 26px;
    border: 2px solid var(--line);
    border-radius: 22px;
    background: var(--paper);
    background-image:
      linear-gradient(to right, rgba(231, 213, 209, 0.45) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(231, 213, 209, 0.45) 1px, transparent 1px);
    background-size: 40px 40px;
    overflow: hidden;
  }

  /* Red identity wash — brand red fading out into the paper. */
  .glow {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(
        120% 90% at 50% 118%,
        rgba(151, 11, 45, 0.3) 0%,
        rgba(151, 11, 45, 0.12) 34%,
        rgba(151, 11, 45, 0) 66%
      ),
      radial-gradient(
        90% 70% at 100% 0%,
        rgba(193, 42, 72, 0.16) 0%,
        rgba(193, 42, 72, 0) 60%
      );
  }

  /* Faded bread behind the name (home card). */
  .watermark {
    position: absolute;
    left: 50%;
    top: 52%;
    transform: translate(-50%, -50%);
    height: 600px;
    opacity: 0.3;
  }

  /* Soft paper veil so the watermark can sit behind the title at full
     strength without hurting legibility. */
  .veil {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 1020px;
    height: 470px;
    background: radial-gradient(
      closest-side,
      rgba(255, 253, 252, 0.72),
      rgba(255, 253, 252, 0.5) 55%,
      rgba(255, 253, 252, 0)
    );
  }

  .content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 22px;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--brand);
  }
  .eyebrow:empty { display: none; }
  .eyebrow .mark {
    width: 11px;
    height: 11px;
    background: var(--brand);
    flex: none;
  }

  h1 {
    font-family: "Instrument Serif", Georgia, serif;
    font-weight: 400;
    font-size: 124px;
    line-height: 0.92;
    letter-spacing: -0.02em;
    color: var(--ink);
  }
  h1 .accent { color: var(--brand); }

  .rule {
    width: 120px;
    height: 5px;
    margin-top: 30px;
    background: var(--brand);
  }

  .stickers {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 34px;
    margin-top: 42px;
  }
  .stickers img {
    height: 116px;
    width: auto;
    object-fit: contain;
    filter: drop-shadow(0 12px 14px rgba(24, 18, 15, 0.14));
  }
  .stickers img:first-child { transform: rotate(-4deg); }
  .stickers img:last-child { transform: rotate(3deg); }
</style>
</head>
<body>
  <div class="frame">
    <div class="glow"></div>
    {{WATERMARK}}
    <div class="veil"></div>
    <div class="content">
      <p class="eyebrow">{{EYEBROW}}</p>
      <h1>{{TITLE}}</h1>
      <span class="rule"></span>
      <div class="stickers">
        <img src="../public/crown.webp" alt="" />
        <img src="../public/ls400.webp" alt="" />
      </div>
    </div>
  </div>
</body>
</html>
